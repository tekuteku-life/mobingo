<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.4" />

  <!-- Grid representation -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="4">
    <line x1="156" y1="96" x2="156" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="356" y1="96" x2="356" y2="416" />
    <line x1="96" y1="176" x2="416" y2="176" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="336" x2="416" y2="336" />
  </g>

  <!-- Central Bingo Ball -->
  <circle cx="256" cy="256" r="140" fill="url(#ballGrad)" filter="url(#glow)" />
  <circle cx="210" cy="210" r="40" fill="#ffffff" opacity="0.3" />
  <circle cx="256" cy="256" r="88" fill="#ffffff" />
  
  <!-- "77" or "B" or "M" in the center -->
  <text x="256" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#0f172a">M</text>
  
  <!-- Accent dots -->
  <circle cx="130" cy="140" r="14" fill="#ef4444" />
  <circle cx="380" cy="140" r="14" fill="#3b82f6" />
  <circle cx="130" cy="370" r="14" fill="#22c55e" />
  <circle cx="380" cy="370" r="14" fill="#eab308" />
</svg>

